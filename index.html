<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صندوق‌های سرمایه‌گذاری</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header class="header">
        <h1>صندوق‌های سرمایه‌گذاری</h1>
        <p>معرفی و مقایسه بازدهی صندوق‌ها</p>
    </header>

    <nav class="fund-tabs" id="fundTabs">
        <!-- تب‌های صندوق‌ها اینجا dynamically اضافه می‌شوند -->
    </nav>

    <main class="main-content">
        <div class="fund-info" id="fundInfo">
            <!-- اطلاعات صندوق انتخاب شده -->
        </div>

        <div class="returns-type-tabs" id="returnsTypeTabs">
            <!-- تب‌های نوع قیمت (صدور، ابطال، آماری) -->
        </div>

        <div class="stats-container" id="statsContainer">
            <!-- کارت‌های آماری بازدهی -->
        </div>

        <div class="chart-container">
            <canvas id="returnsChart"></canvas>
        </div>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
